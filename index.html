<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>李顺 · silencewood</title>
<meta name="description" content="李顺的个人站点入口：博客、代码仓库与后续项目的统一入口。">
<meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f6e56'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='%23faf9f6'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #faf9f6;
    --surface: #ffffff;
    --text: #1b1b18;
    --muted: #6b6a63;
    --line: #e3e1d9;
    --accent: #0f6e56;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413;
      --surface: #1c1c1a;
      --text: #f2f1ec;
      --muted: #a3a19a;
      --line: #2e2e2b;
      --accent: #5dcaa5;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: clamp(48px, 9vw, 92px) 24px clamp(32px, 6vw, 48px);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    gap: clamp(40px, 6vw, 64px);
  }
  .eyebrow {
    margin: 0;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    margin: 10px 0 14px;
    font-size: clamp(32px, 6vw, 44px);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }
  .lede {
    margin: 0;
    max-width: 32em;
    font-size: 15px;
    color: var(--muted);
  }
  .section-title {
    margin: 0 0 16px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .cards {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  }
  .cards > li { display: flex; }
  .card {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
    padding: 20px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: inherit;
    text-decoration: none;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  a.card:hover { border-color: var(--accent); transform: translateY(-2px); }
  a.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .card-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 16px;
    font-weight: 500;
  }
  .card-title .arrow { color: var(--accent); font-size: 15px; line-height: 1; }
  .card-desc { font-size: 13.5px; color: var(--muted); }
  .card-meta {
    margin-top: auto;
    padding-top: 10px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    color: var(--muted);
  }
  .card.ghost { border-style: dashed; background: transparent; }
  .card.ghost .card-title { font-weight: 400; color: var(--muted); }
  .card.ghost .card-desc { color: var(--muted); }
  footer {
    margin-top: auto;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 8px 20px;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
  }
  footer a {
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  footer a:hover { color: var(--accent); border-color: var(--accent); }
  footer a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .footer-links { display: flex; flex-wrap: wrap; gap: 16px; }
  @media (prefers-reduced-motion: reduce) {
    a.card { transition: none; }
    a.card:hover { transform: none; }
  }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <p class="eyebrow">silencewood.cn</p>
    <h1>李顺</h1>
    <p class="lede">前端开发。写代码，也写天气。这里是我做过的项目与写下的笔记——没有算法，没有广告。</p>
  </header>

  <section aria-labelledby="projects-heading">
    <h2 id="projects-heading" class="section-title">项目</h2>
    <ul class="cards">
      <li>
        <a class="card" href="https://blogs.silencewood.cn/">
          <span class="card-title">不系舟 <span class="arrow" aria-hidden="true">&rarr;</span></span>
          <span class="card-desc">技术笔记、生活碎片，和一些还没想清楚的问题。</span>
          <span class="card-meta">blogs.silencewood.cn</span>
        </a>
      </li>
      <li>
        <a class="card" href="https://github.com/silent-wood">
          <span class="card-title">GitHub <span class="arrow" aria-hidden="true">&rarr;</span></span>
          <span class="card-desc">代码仓库、开源练习与这几年的提交记录。</span>
          <span class="card-meta">github.com/silent-wood</span>
        </a>
      </li>
      <li>
        <div class="card ghost">
          <span class="card-title">更多项目</span>
          <span class="card-desc">新的实验会陆续挂到这个域名下，各自独立部署。</span>
          <span class="card-meta">xxx.silencewood.cn</span>
        </div>
      </li>
    </ul>
  </section>

  <footer>
    <span>上海 · 前端开发</span>
    <span class="footer-links">
      <a href="mailto:silencewood@163.com">邮箱</a>
      <a href="https://github.com/silent-wood">GitHub</a>
    </span>
  </footer>
</main>
</body>
</html>
